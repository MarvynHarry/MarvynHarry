name: Generate contribution snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d9a05b&color_dots=#ebedf0,#f3dfbf,#e8c38d,#dfa964,#c98a3e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d9a05b&color_dots=#161b22,#4a3a24,#7a5a2e,#b07d3c,#d9a05b

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
